name: "App DevSecOps CI/CD"

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "iac/**"
      - ".github/workflows/app-cicd.yml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - "iac/**"
      - ".github/workflows/app-cicd.yml"

permissions:
  id-token: write   
  contents: read     
jobs:
  security-and-test:
    name: "Security Scan & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Run Gitleaks (Secret Scanner)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "./iac"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install dependencies & Run Tests
        working-directory: backend
        run: |
          npm ci || npm install
          npm test

  build-scan-and-push:
    name: "Build, Scan & Push ECR (OIDC)"
    runs-on: ubuntu-latest
    needs: [security-and-test]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true 
          tags: xianxia-chat:local-scan
          cache-from: type=gha

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "xianxia-chat:local-scan"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0" 

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to Amazon ECR
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max