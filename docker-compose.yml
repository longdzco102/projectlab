services:
  # ── 1. Web & API Application ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xianxia-chat-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=webchat
      - DB_SSL=false
      - JWT_SECRET=xianxia_secret_jwt_key_2026
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy

  # ── 2. PostgreSQL Database (Khớp RDS Postgres 16) ────────
  db:
    image: postgres:16-alpine
    container_name: xianxia-chat-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=webchat
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webchat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
